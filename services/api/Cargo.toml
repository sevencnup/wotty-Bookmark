[package]
name = "bookmark-vault-api"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aes-gcm = "0.10"
axum = "0.7.9"
argon2 = "0.5"
base64 = "0.22"
home = "=0.5.9"
idna = "=0.3.0"
chrono = { version = "0.4", features = ["serde"] }
httpdate = "1"
rand = "0.8"
percent-encoding = "2.3"
pbkdf2 = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
quick-xml = "0.37"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "sync"] }
tower-http = { version = "0.5.2", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "=2.4.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
