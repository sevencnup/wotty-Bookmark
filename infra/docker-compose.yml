services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookmark_vault}
      POSTGRES_USER: ${POSTGRES_USER:-bookmark_vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: bookmark_vault_api=info,tower_http=info
      DATABASE_URL: ${DATABASE_URL:-postgres://bookmark_vault:change-me-in-production@postgres:5432/bookmark_vault}
      DATA_DIR: /var/lib/bookmark-vault
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - bookmark-data:/var/lib/bookmark-vault
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres-data:
  bookmark-data:
