services:
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0:26626
      RUST_LOG: bookmark_vault_api=info,tower_http=info
      DATABASE_URL: ${DATABASE_URL:-sqlite:///var/lib/bookmark-vault/bookmark-vault.sqlite}
      DATA_DIR: /var/lib/bookmark-vault
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - bookmark-data:/var/lib/bookmark-vault
    ports:
      - "26626:26626"

volumes:
  bookmark-data:
