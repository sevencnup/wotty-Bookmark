services:
  api:
    image: ghcr.io/${GHCR_NAMESPACE:-sevencnup}/wotty-bookmark-api:${IMAGE_TAG:-latest}
    build: !reset null
    ports: !reset []
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///var/lib/bookmark-vault/bookmark-vault.sqlite}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}

  caddy:
    image: ghcr.io/${GHCR_NAMESPACE:-sevencnup}/wotty-bookmark-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      BOOKMARK_VAULT_DOMAIN: ${BOOKMARK_VAULT_DOMAIN:?BOOKMARK_VAULT_DOMAIN must be set}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
